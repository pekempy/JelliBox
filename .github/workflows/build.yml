name: Build UWP Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: NuGet restore
        run: nuget restore JelliBox.sln

      - name: Dump environment (diagnostic)
        shell: pwsh
        run: |
          Write-Host "=== VS path ===" 
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "=== Windows SDKs ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP" -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host "=== System.Runtime in .NET 4.8 Facades? ==="
          $facade = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8\Facades\System.Runtime.dll"
          Test-Path $facade
          Write-Host "=== UnionMetadata 26100 Windows.winmd? ==="
          Test-Path "C:\Program Files (x86)\Windows Kits\10\UnionMetadata\10.0.26100.0\Windows.winmd"
          Write-Host "=== XAML targets exist? ==="
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $targets = "$vsPath\MSBuild\Microsoft\WindowsXaml"
          if (Test-Path $targets) { Get-ChildItem $targets } else { Write-Host "NOT FOUND: $targets" }

      - name: Generate placeholder assets
        shell: pwsh
        run: |
          $sizes = @(
            @{name="Square44x44Logo";   w=44;  h=44},
            @{name="Square150x150Logo"; w=150; h=150},
            @{name="Wide310x150Logo";   w=310; h=150},
            @{name="StoreLogo";         w=50;  h=50},
            @{name="SplashScreen";      w=620; h=300}
          )
          Add-Type -AssemblyName System.Drawing
          $dir = "JelliBox\Assets"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($s in $sizes) {
            $path = "$dir\$($s.name).png"
            if (-not (Test-Path $path)) {
              $bmp = New-Object System.Drawing.Bitmap $s.w, $s.h
              $g   = [System.Drawing.Graphics]::FromImage($bmp)
              $g.Clear([System.Drawing.Color]::FromArgb(13, 13, 13))
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
              Write-Host "Created $path"
            }
          }

      - name: Create signing certificate
        shell: pwsh
        run: |
          # A fresh self-signed certificate for this build. Its subject must match the Publisher in Package.appxmanifest.
          # No key or password is stored in the repository.
          $subject = "CN=761924F3-0C6F-40E3-A72E-39D9BFD770F0"
          $password = [guid]::NewGuid().ToString("N")
          Write-Host "::add-mask::$password"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $subject -KeyUsage DigitalSignature `
            -FriendlyName "Jellibox CI build" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfx = Join-Path $env:RUNNER_TEMP "Jellibox_CI.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -Force -AsPlainText) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\JelliBox.cer" | Out-Null
          Import-Certificate -FilePath "$env:GITHUB_WORKSPACE\JelliBox.cer" -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          "CERT_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CERT_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Created a signing certificate for this build."

      - name: Build & generate package
        shell: pwsh
        run: |
          msbuild JelliBox\JelliBox.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:CERT_PFX" `
            /p:PackageCertificatePassword="$env:CERT_PASSWORD" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppxPackages\" `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=StoreAndSideload `
            /verbosity:minimal `
            /flp:logfile=build.log`;Summary`;Verbosity=normal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== ERRORS ==="
            Get-Content build.log | Select-String "error|Error" | Select-Object -Last 40
            Write-Host "=== LAST 60 LINES ==="
            Get-Content build.log -Tail 60
            exit 1
          }

      - name: Verify and sign packages with SignTool
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Write-Host "Using SignTool: $signtool"
          $pfxPath = $env:CERT_PFX
          $packages = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\AppxPackages" -Include "*.msix","*.appx" -Recurse
          foreach ($pkg in $packages) {
            Write-Host "Checking signature on $($pkg.FullName)..."
            $verifyOut = & $signtool verify /pa $pkg.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Package not signed or verification failed ($verifyOut); signing with SignTool..."
              & $signtool sign /fd SHA256 /a /f $pfxPath /p $env:CERT_PASSWORD $pkg.FullName
              & $signtool verify /pa $pkg.FullName
            } else {
              Write-Host "Signature verified successfully on $($pkg.Name)"
            }
          }

      - name: Bundle certificate and install script
        shell: pwsh
        run: |
          Copy-Item "JelliBox.cer" -Destination "$env:GITHUB_WORKSPACE\AppxPackages\JelliBox.cer" -Force
          Copy-Item "Install-JelliBox.ps1" -Destination "$env:GITHUB_WORKSPACE\AppxPackages\Install-JelliBox.ps1" -Force
          $testDirs = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\AppxPackages" -Directory -Recurse | Where-Object { $_.Name -like "*_Test" }
          foreach ($td in $testDirs) {
            Copy-Item "JelliBox.cer" -Destination "$($td.FullName)\JelliBox.cer" -Force
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: JelliBox-x64-Release
          path: AppxPackages/
          if-no-files-found: error
          retention-days: 30
